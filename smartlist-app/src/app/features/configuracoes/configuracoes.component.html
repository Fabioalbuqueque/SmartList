<section class="page">
  <header class="page-header">
    <div>
      <p class="eyebrow">Configurações</p>
      <h2>Preferências e metas de gasto</h2>
    </div>
  </header>

  <article class="panel">
    <h3>Perfil do estabelecimento</h3>
    <form class="form-card" (ngSubmit)="saveProfile()">
      <label>
        Nome para o app
        <input type="text" [(ngModel)]="profileName" name="profileName" placeholder="Ex.: Ana" />
      </label>

      <label>
        Endereço ou nome do estabelecimento
        <input type="text" [(ngModel)]="establishmentLocationLabel" name="establishmentLocationLabel" placeholder="Ex.: Mercado Central ou Rua das Flores, 123" />
      </label>

      <div class="actions-row">
        <button type="button" class="secondary" (click)="searchLocationByText()" [disabled]="isLocating">
          {{ isLocating ? 'Buscando...' : 'Buscar localização' }}
        </button>

        <button type="button" class="secondary" (click)="detectLocation()" [disabled]="isLocating">
          {{ isLocating ? 'Buscando...' : 'Usar minha localização' }}
        </button>
      </div>

      @if (locationStatus) {
        <p class="message">{{ locationStatus }}</p>
      }

      <button type="submit">Salvar perfil</button>
      @if (message) {
        <p class="message">{{ message }}</p>
      }
    </form>
  </article>

  <article class="panel">
    <h3>Metas de gasto — {{ month }}</h3>
    <form class="form-card" (ngSubmit)="saveGoals()">
      <label>
        Meta geral (R$)
        <input type="number" step="0.01" [(ngModel)]="generalGoal" name="generalGoal" />
      </label>

      <h4>Metas por categoria</h4>
      @for (cat of categories(); track cat.id) {
        <label>
          {{ cat.icon }} {{ cat.name }} (R$)
          <input
            type="number"
            step="0.01"
            [value]="categoryGoals[cat.id] ?? ''"
            (input)="updateCategoryGoal(cat.id, $any($event.target).value)"
          />
        </label>
      }

      <button type="submit">Salvar metas</button>
      @if (message) {
        <p class="message">{{ message }}</p>
      }
    </form>
  </article>
</section>
